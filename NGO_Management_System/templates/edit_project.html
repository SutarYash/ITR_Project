<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f6f9;
        }

        .edit-form{
            max-width:700px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        .page-title{
            text-align:center;
            margin-bottom:25px;
            color:#0d6efd;
            font-weight:bold;
        }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container">

    <div class="edit-form">

        <h2 class="page-title">Edit Project</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Project Title</label>
                <input type="text"
                       class="form-control"
                       name="title"
                       value="{{ project[1] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control"
                          name="description"
                          rows="5"
                          required>{{ project[2] }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>

                <select class="form-select" name="status">

                    <option value="Ongoing"
                    {% if project[3]=='Ongoing' %}selected{% endif %}>
                    Ongoing
                    </option>

                    <option value="Completed"
                    {% if project[3]=='Completed' %}selected{% endif %}>
                    Completed
                    </option>

                    <option value="Upcoming"
                    {% if project[3]=='Upcoming' %}selected{% endif %}>
                    Upcoming
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>

                <input type="text"
                       class="form-control"
                       name="location"
                       value="{{ project[6] }}">
            </div>

            <button type="submit"
                    class="btn btn-warning w-100">
                Update Project
            </button>

        </form>

    </div>

</div>


<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>


</body>
</html>
