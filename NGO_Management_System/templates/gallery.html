<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container mt-5">

<div class="d-flex justify-content-between">

<h2>Image Gallery</h2>

<a href="/add_gallery" class="btn btn-success">
+ Add Image
</a>

</div>

<hr>

<div class="row">

{% for image in gallery %}

<div class="col-md-4 mb-4">

<div class="card">

<img
src="{{ url_for('static', filename='uploads/' + image['image']) }}"
class="card-img-top"
height="250"
style="object-fit:cover;">

<div class="card-body">

<p>{{ image["description"] }}</p>

<a href="/edit_gallery/{{ image['id'] }}"
class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete_gallery/{{ image['id'] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete image?')">
Delete
</a>

</div>

</div>

</div>

{% endfor %}

</div>

<a href="/dashboard" class="btn btn-secondary">
← Dashboard
</a>

</div>


<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>


</body>
</html>
