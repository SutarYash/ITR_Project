<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Press Release</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Add Press Release</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text"
                   name="title"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="6"
                required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Release Date</label>

            <input
                type="date"
                name="release_date"
                class="form-control"
                required>
        </div>

        <button class="btn btn-success">
            Save Press Release
        </button>

        <a href="/press_releases"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>


<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>
</body>
</html>
