<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Gallery Image</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        .container{
            max-width:700px;
            margin-top:40px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        img{
            border-radius:8px;
            object-fit:cover;
        }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container">

    <h2 class="mb-4">Edit Gallery Image</h2>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Current Image</label><br>

            <img
                src="{{ url_for('static', filename='uploads/' + image['image']) }}"
                width="250"
                height="180">
        </div>

        <div class="mb-3">
            <label class="form-label">Upload New Image (Optional)</label>

            <input
                type="file"
                name="image"
                class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="5"
                required>{{ image["description"] }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Update Image
        </button>

        <a href="/gallery" class="btn btn-secondary">
            Cancel
        </a>

        <a href="/dashboard" class="btn btn-outline-dark float-end">
            Back to Dashboard
        </a>

    </form>

</div>


<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>


</body>
</html>
