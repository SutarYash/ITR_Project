<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Video</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container mt-5">

    <h2>Edit Video</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">YouTube URL</label>

            <input
                type="url"
                name="video_url"
                class="form-control"
                value="{{ video['video_url'] }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="4"
                required>{{ video['description'] }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Update Video
        </button>

        <a href="/videos" class="btn btn-secondary">
            Cancel
        </a>

        <a href="/dashboard" class="btn btn-outline-dark float-end">
            Back to Dashboard
        </a>

    </form>

</div>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>

</body>
</html>
