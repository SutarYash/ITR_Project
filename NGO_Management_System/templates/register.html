<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">


    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        body{
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #0d9488, #4f46e5, #4facfe);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift{
            0%{ background-position: 0% 50%; }
            50%{ background-position: 100% 50%; }
            100%{ background-position: 0% 50%; }
        }

        body::before, body::after{
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            background: rgba(255,255,255,0.35);
            z-index: 0;
        }

        body::before{
            width: 320px;
            height: 320px;
            top: -100px;
            right: -100px;
        }

        body::after{
            width: 260px;
            height: 260px;
            bottom: -80px;
            left: -80px;
            background: rgba(255,255,255,0.25);
        }

        .container{
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            width: 90%;
            max-width: 360px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0px 20px 45px rgba(15,23,42,0.25);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp{
            from{ opacity: 0; transform: translateY(24px); }
            to{ opacity: 1; transform: translateY(0); }
        }

        .register-icon{
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d9488, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 20px rgba(13,148,136,0.35);
        }

        h1{
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle{
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input{
            width: 90%;
            padding: 13px 14px;
            margin: 10px 0;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus{
            border-color: #0d9488;
            box-shadow: 0 0 0 4px rgba(13,148,136,0.12);
        }

        button{
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0d9488, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 18px rgba(13,148,136,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover{
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 12px 24px rgba(13,148,136,0.4);
        }

        a{
            text-decoration: none;
            color: #0d9488;
            font-weight: 500;
        }

        a:hover{
            text-decoration: underline;
        }

        p{
            color: #e11d48;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="register-icon">📝</div>

        <h1>Create Account</h1>
        <p class="subtitle">Join us and get started</p>

        <p>{{ message }}</p>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <a href="/login">
            Already have account? Login
        </a>

    </div>


    <script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>


</body>
</html>
