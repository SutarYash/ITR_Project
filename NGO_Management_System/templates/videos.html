<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos</title>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">



<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container mt-5">

<div class="d-flex justify-content-between">

<h2>Video Gallery</h2>

<a href="/add_video" class="btn btn-success">
+ Add Video
</a>

</div>

<hr>

<div class="row">

{% for video in videos %}

<div class="col-md-6 mb-4">

<div class="card">

<div class="card-body">

<p>{{ video["description"] }}</p>

<a
href="{{ video['video_url'] }}"
target="_blank"
class="btn btn-primary">
Watch Video
</a>

<a
href="/edit_video/{{ video['id'] }}"
class="btn btn-warning">
Edit
</a>

<a
href="/delete_video/{{ video['id'] }}"
class="btn btn-danger"
onclick="return confirm('Delete video?')">
Delete
</a>

</div>

</div>

</div>

{% endfor %}

</div>

<a href="/dashboard" class="btn btn-secondary">
← Dashboard
</a>

</div>


<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>


</body>
</html>
