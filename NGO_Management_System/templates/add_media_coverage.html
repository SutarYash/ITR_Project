<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Media Coverage</title>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin-theme.css') }}">

</head>
<body>

<div class="container mt-5">

<h2>Add Media Coverage</h2>

<form method="POST">

<div class="mb-3">

<label>Title</label>

<input
type="text"
name="title"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Media URL</label>

<input
type="url"
name="url"
class="form-control"
placeholder="https://example.com/article"
required>

</div>

<button class="btn btn-success">
Save
</button>

<a href="/media_coverages"
class="btn btn-secondary">
Cancel
</a>

</form>

</div>


<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>


</body>
</html>
